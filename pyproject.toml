[project]
name = "trivium"
version = "0.2.0"
description = "A local System-1 router that sends each prompt to the right model: a local Qwen, Claude Code, or Codex."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/trivium/_semif/LICENSE"]
authors = [{ name = "Ellert van der Vecht", email = "7ucardie@gmail.com" }]
requires-python = ">=3.10,<3.14"
keywords = ["llm", "router", "claude-code", "codex", "mlx", "qwen", "semif", "laya"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
dependencies = [
  "pyyaml>=6",
  "transformers>=5.17",
  "huggingface-hub>=1.0",
  # The default runtime: semif's MLX readout (vendored in trivium._semif) on Apple Silicon.
  "mlx>=0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-lm>=0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
# router.runtime: torch, for CUDA GPUs (and Apple GPUs through MPS).
torch = ["torch>=2.10", "accelerate>=1.12"]
# router.runtime: llamacpp, CPU scoring from a local GGUF file.
llamacpp = ["llama-cpp-python==0.3.35", "numpy>=2"]
# router.backend: laya or hybrid.
laya = ["laya>=0.3.20,<0.4"]

[project.urls]
Homepage = "https://github.com/7ucardie/trivium"
Issues = "https://github.com/7ucardie/trivium/issues"

[project.scripts]
ask = "trivium.cli:main"
trivium = "trivium.cli:main"

[dependency-groups]
dev = ["pytest>=8", "build>=1.2", "twine>=6"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trivium = ["targets.yaml", "_semif/LICENSE", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
