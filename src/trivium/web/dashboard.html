<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="trivium-token" content="__TRIVIUM_TOKEN__">
<title>Trivium</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 160'%3E%3Crect width='160' height='160' rx='34' fill='%23062f3a'/%3E%3Cg fill='none' stroke-width='16' stroke-linecap='round'%3E%3Cpath d='M80 58V126' stroke='%23f4efe2'/%3E%3Cpath d='M80 58H36' stroke='%236ad7cf'/%3E%3Cpath d='M80 58H124' stroke='%230f8c8f'/%3E%3C/g%3E%3Ccircle cx='80' cy='58' r='13' fill='%23062f3a' stroke='%23f4efe2' stroke-width='7'/%3E%3C/svg%3E">
<style>
/* The Trivium theme, from one palette: #062f3a #0b5562 #0f8c8f #6ad7cf #f4efe2.
   Cream paper in light, deep water in dark; the three roads are three steps of the same sea. */
:root {
  --bg:#f4efe2; --panel:#fbf8f0; --panel2:#ebe5d5; --text:#062f3a; --dim:#4d6c72; --line:#ddd5c2;
  --accent:#0b5562; --accent-ink:#f4efe2; --warn:#8a5a00; --good:#177a52; --bad:#b3372c;
  --bar:#e6dfcd; --bar-top:#bfe9e3;
  --claude:#0f8c8f; --codex:#062f3a; --local:#0b5562;
  --shadow:0 1px 2px rgba(6,47,58,.06), 0 10px 28px -18px rgba(6,47,58,.28);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#062f3a; --panel:#083945; --panel2:#0a4652; --text:#f4efe2; --dim:#9cc1c0; --line:#125a66;
    --accent:#6ad7cf; --accent-ink:#062f3a; --warn:#e6b25a; --good:#7ed9a0; --bad:#f08a7a;
    --bar:#0b5562; --bar-top:#0f8c8f;
    --claude:#6ad7cf; --codex:#f4efe2; --local:#38b3b0;  /* a lighter step of #0f8c8f: readable as text */
    --shadow:none;
  }
}
:root {
  --claude-tint:color-mix(in srgb, var(--claude) 30%, var(--panel2));
  --codex-tint:color-mix(in srgb, var(--codex) 22%, var(--panel2));
  --local-tint:color-mix(in srgb, var(--local) 30%, var(--panel2));
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
body::before { content:""; display:block; height:3px;
  background:linear-gradient(90deg, #0b5562, #0f8c8f, #6ad7cf); }
main { max-width:1100px; margin:0 auto; padding:24px 16px 56px; }
header { display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; margin-bottom:18px; }
header h1 { display:flex; align-items:center; gap:9px; font-size:18px; font-weight:650; letter-spacing:.01em; margin:0; }
header svg { width:24px; height:24px; }
header a { color:var(--accent); text-underline-offset:3px; }
.meta { color:var(--dim); font-size:12.5px; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; box-shadow:var(--shadow); }
label, th { text-transform:uppercase; letter-spacing:.06em; }
label { display:block; color:var(--dim); font-size:11px; margin-bottom:5px; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
select, input[type=text], textarea {
  width:100%; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:8px;
  padding:8px 10px; font:inherit;
}
textarea { min-height:84px; resize:vertical; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; }
button {
  font:inherit; border-radius:8px; border:1px solid var(--line); background:var(--panel2); color:var(--text);
  padding:7px 14px; cursor:pointer; transition:background .12s, border-color .12s;
}
button:hover:not(:disabled) { border-color:var(--dim); }
button.primary:hover:not(:disabled) { border-color:var(--accent); filter:brightness(1.06); }
button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
button:disabled { opacity:.45; cursor:default; }
button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.hint { color:var(--dim); font-size:12px; }
.target { font-size:22px; font-weight:700; letter-spacing:-.01em; color:var(--accent); }
.target[data-vendor=claude] { color:var(--claude); }
.target[data-vendor=codex] { color:var(--codex); }
.target[data-vendor=local] { color:var(--local); }
[data-vendor=claude] { --v:var(--claude); --v-tint:var(--claude-tint); }
[data-vendor=codex] { --v:var(--codex); --v-tint:var(--codex-tint); }
[data-vendor=local] { --v:var(--local); --v-tint:var(--local-tint); }
#decision[data-vendor] { border-left:3px solid var(--v); }
#decision[data-vendor] button.primary { background:var(--v); border-color:var(--v); }
.dot::before { content:""; display:inline-block; width:8px; height:8px; border-radius:50%;
  background:var(--v, var(--dim)); margin-right:7px; vertical-align:1px; }
td.dot { color:var(--v, inherit); font-weight:550; }
td.good { color:var(--good); } td.bad { color:var(--bad); }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; }
.chip { border-radius:999px; padding:4px 11px; font-size:13px; }
.chip.on { background:var(--v-tint, var(--accent)); color:var(--text); border-color:var(--v, var(--accent)); font-weight:600; }
.q { display:grid; grid-template-columns:90px 1fr; gap:6px 10px; align-items:center; margin:8px 0; font-size:13px; }
.bars { display:flex; flex-direction:column; gap:3px; }
.bar { position:relative; background:var(--panel2); border-radius:6px; height:22px; overflow:hidden; }
.bar span.fill { position:absolute; inset:0 auto 0 0; background:var(--bar); border-radius:6px; }
.bar.top span.fill { background:var(--bar-top); }
.q:nth-child(1) { --q:var(--claude); --q-tint:var(--claude-tint); }
.q:nth-child(2) { --q:var(--local); --q-tint:var(--local-tint); }
.q:nth-child(3) { --q:var(--codex); --q-tint:var(--codex-tint); }
.q .name { color:var(--q, var(--dim)); font-weight:550; }
.q .bar.top span.fill { background:var(--q-tint, var(--bar-top)); }
.bar span.txt { position:relative; padding:0 8px; line-height:22px; font-size:12px; white-space:nowrap; }
.bar.top span.txt { font-weight:600; }
.warn { color:var(--warn); }
pre.out {
  white-space:pre-wrap; word-break:break-word; background:var(--panel2); border-radius:8px; padding:10px;
  margin:10px 0 0; max-height:420px; overflow:auto; font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
}
.rate button.good { color:var(--good); } .rate button.bad { color:var(--bad); }
.scroll { overflow-x:auto; }
table { border-collapse:collapse; width:100%; }
th, td { text-align:left; padding:8px 8px; border-bottom:1px solid var(--line); vertical-align:top; font-size:13px; }
th { color:var(--dim); font-weight:500; font-size:11px; }
tbody tr:hover td { background:var(--panel2); }
tr:last-child td { border-bottom:0; }
td.prompt { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; min-width:240px; }
td.num { text-align:right; font-variant-numeric:tabular-nums; }
.nowrap { white-space:nowrap; } .dim { color:var(--dim); }
.error { color:var(--bad); margin-top:8px; }
[hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1><svg viewBox="16 22 128 128" aria-hidden="true"><g fill="none" stroke-width="18" stroke-linecap="round">
      <path d="M80 58V134" stroke="var(--local)"/><path d="M80 58H30" stroke="var(--claude)"/>
      <path d="M80 58H130" stroke="var(--codex)"/></g>
      <circle cx="80" cy="58" r="14" fill="var(--bg)" stroke="currentColor" stroke-width="8"/></svg>Trivium</h1>
    <span class="meta" id="meta">connecting…</span>
    <span class="meta"><a href="/status">status</a></span>
  </header>

  <section class="panel" aria-labelledby="ask-h">
    <h2 id="ask-h" hidden>Ask</h2>
    <label for="project">Project</label>
    <div class="row" style="margin-bottom:10px">
      <select id="project" style="flex:1 1 320px"></select>
      <input type="text" id="project-other" placeholder="/path/to/project" style="flex:1 1 320px" hidden>
    </div>
    <label for="prompt">Prompt</label>
    <textarea id="prompt" placeholder="add retry with exponential backoff to the http client"></textarea>
    <div class="row" style="margin-top:8px; justify-content:space-between">
      <span class="hint">⌘/Ctrl + Enter routes it. Nothing runs until you choose.</span>
      <button class="primary" id="route">Route</button>
    </div>
    <div class="error" id="ask-error" role="alert"></div>
  </section>

  <section class="panel" id="decision" hidden aria-live="polite">
    <div class="row" style="justify-content:space-between; align-items:baseline">
      <div><span class="target" id="d-target"></span> <span class="dim" id="d-model"></span></div>
      <span class="hint" id="d-meta"></span>
    </div>
    <div class="warn" id="d-unsure"></div>
    <div class="warn" id="d-guard"></div>
    <div class="chips" id="d-alts" role="radiogroup" aria-label="Target"></div>
    <div id="d-answers"></div>
    <div class="row" style="margin-top:10px">
      <button class="primary" id="open">Open in Terminal</button>
      <button id="oneshot">One-shot answer here</button>
      <span class="hint" id="run-hint"></span>
    </div>
    <div class="hint" id="run-status" aria-live="polite"></div>
    <pre class="out" id="out" hidden></pre>
    <div class="row rate" id="rate" hidden style="margin-top:10px">
      <span class="dim">Right model?</span>
      <button class="good" id="rate-good">✓ Good</button>
      <button class="bad" id="rate-bad">✗ Bad</button>
      <select id="should" aria-label="Should have gone to" style="width:auto" hidden></select>
      <span class="hint" id="rate-done"></span>
    </div>
    <div class="error" id="run-error" role="alert"></div>
  </section>

  <section class="panel" aria-labelledby="recent-h">
    <div class="row" style="justify-content:space-between">
      <h2 id="recent-h" style="font-size:15px; margin:0 0 8px">Recent decisions</h2>
      <span class="hint" id="recent-meta"></span>
    </div>
    <div class="scroll"><table>
      <thead><tr><th>When</th><th>Prompt</th><th>Target</th><th>Kind · difficulty · tools</th><th class="num">ms</th><th>Rated</th></tr></thead>
      <tbody id="recent"></tbody>
    </table></div>
  </section>
</main>

<script>
"use strict";
const TOKEN = document.querySelector('meta[name="trivium-token"]').content;
const $ = (id) => document.getElementById(id);
let targets = [], current = null, chosen = null;

async function api(path, body) {
  const opts = { headers: { "X-Trivium-Token": TOKEN } };
  if (body !== undefined) {
    opts.method = "POST";
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const r = await fetch(path, opts);
  if (!r.ok) {
    let msg = r.status + " " + r.statusText;
    try { msg = (await r.json()).error || msg; } catch (e) {}
    throw new Error(msg);
  }
  return r;
}

function el(tag, props, ...children) {
  const node = document.createElement(tag);
  Object.assign(node, props || {});
  for (const c of children) node.append(c);
  return node;
}

function ago(ts) {
  const s = Math.max(0, Math.floor(Date.now() / 1000 - ts));
  if (s >= 86400) return Math.floor(s / 86400) + "d";
  if (s >= 3600) return Math.floor(s / 3600) + "h";
  if (s >= 60) return Math.floor(s / 60) + "m";
  return s + "s";
}

async function loadStatus() {
  try {
    const s = await (await api("/api/status")).json();
    const ms = s.route_ms.slice().sort((a, b) => a - b);
    const p50 = ms.length ? Math.round(ms[Math.floor(ms.length / 2)]) + " ms" : "–";
    $("meta").textContent = `${s.model} · ${s.backend} · ${s.runtime} · ${s.routes} routed · p50 ${p50}`;
  } catch (e) { $("meta").textContent = "server not reachable: " + e.message; }
}

async function loadProjects() {
  const list = await (await api("/api/projects")).json();
  const sel = $("project");
  sel.replaceChildren();
  for (const p of list) sel.append(el("option", { value: p, textContent: p }));
  sel.append(el("option", { value: "__other", textContent: "Other folder…" }));
  try { const saved = localStorage.getItem("trivium.project"); if (saved && list.includes(saved)) sel.value = saved; } catch (e) {}
}

function projectPath() {
  return $("project").value === "__other" ? $("project-other").value.trim() : $("project").value;
}

function targetName(name) {
  const t = targets.find((x) => x.name === name);
  return t ? `${t.model}` : name;
}

async function route() {
  const prompt = $("prompt").value.trim();
  $("ask-error").textContent = "";
  if (!prompt) return;
  $("route").disabled = true;
  $("route").textContent = "Routing…";
  try {
    current = await (await api("/api/decide", { prompt, cwd: projectPath() })).json();
    chosen = current.target.name;
    try { localStorage.setItem("trivium.project", $("project").value); } catch (e) {}
    showDecision();
    loadRecent();
    loadStatus();
  } catch (e) {
    $("ask-error").textContent = e.message;
  } finally {
    $("route").disabled = false;
    $("route").textContent = "Route";
  }
}

function showDecision() {
  const d = current;
  $("decision").hidden = false;
  $("out").hidden = true; $("out").textContent = "";
  $("rate").hidden = true; $("rate-done").textContent = ""; $("should").hidden = true;
  $("run-error").textContent = "";
  $("d-meta").textContent = `${Math.round(d.route_ms)} ms · ${d.reason}` + (d.repo ? ` · repo ${d.repo}` : "");
  $("d-unsure").textContent = d.unsure.length ? "Unsure about " + d.unsure.join(", ") + ": sent to the fallback" : "";
  $("d-guard").textContent = (d.guard || []).length
    ? "Guard: " + d.guard.map(g => `${g.action === "redact" ? "redacted" : "found"} ${g.count} ${g.kind}`).join(", ")
    : "";
  const alts = $("d-alts");
  alts.replaceChildren();
  for (const a of d.alternatives) {
    const b = el("button", { className: "chip dot" + (a.name === chosen ? " on" : ""), textContent: `${a.name} ${Math.round(a.p * 100)}%` });
    b.dataset.vendor = a.vendor;
    b.setAttribute("role", "radio");
    b.setAttribute("aria-checked", String(a.name === chosen));
    b.onclick = () => choose(a.name);
    alts.append(b);
  }
  const answers = $("d-answers");
  answers.replaceChildren();
  for (const [q, a] of Object.entries(d.answers)) {
    const ranked = Object.entries(a.probabilities).sort((x, y) => y[1] - x[1]).slice(0, 3);
    const bars = el("div", { className: "bars" });
    ranked.forEach(([opt, p], i) => {
      const fill = el("span", { className: "fill" }); fill.style.width = Math.round(p * 100) + "%";
      bars.append(el("div", { className: "bar" + (i === 0 ? " top" : "") }, fill,
        el("span", { className: "txt", textContent: `${opt} ${Math.round(p * 100)}%` })));
    });
    answers.append(el("div", { className: "q" }, el("span", { className: "name", textContent: q }), bars));
  }
  updateChosen();
}

function updateChosen() {
  const t = targets.find((x) => x.name === chosen) || current.target;
  $("d-target").textContent = chosen;
  $("d-target").dataset.vendor = t.vendor;
  $("decision").dataset.vendor = t.vendor;
  $("d-model").textContent = t.model;
  for (const b of $("d-alts").children) {
    const on = b.textContent.startsWith(chosen + " ");
    b.classList.toggle("on", on);
    b.setAttribute("aria-checked", String(on));
  }
  const local = t.vendor === "local";
  $("open").disabled = local;
  $("open").textContent = local ? "Local model: one-shot only" : `Open in ${t.vendor === "claude" ? "Claude Code" : "Codex"}`;
  $("run-hint").textContent = local ? "" : "opens a Terminal window in the project";
}

async function choose(name) {
  if (name === chosen) return;
  chosen = name;
  updateChosen();
  if (name !== current.target.name) {
    try { await api("/api/pick", { id: current.id, target: name }); loadRecent(); } catch (e) { $("run-error").textContent = e.message; }
  }
}

async function run(mode) {
  $("run-error").textContent = "";
  const body = { id: current.id, target: chosen, mode };
  if (mode === "terminal") {
    try {
      await api("/api/run", body);
      $("run-hint").textContent = "opened in a Terminal window";
      $("rate").hidden = false;
    } catch (e) { $("run-error").textContent = e.message; }
    return;
  }
  // One-shot: the server sends one JSON event per line. Claude streams its answer; Codex reports its
  // steps and sends the answer when done. Either way, show that it is working until text arrives.
  const out = $("out"), status = $("run-status");
  out.hidden = true; out.textContent = "";
  $("oneshot").disabled = true;
  const started = Date.now();
  let step = "starting", gotText = false, failed = false;
  const tick = () => {
    const s = Math.round((Date.now() - started) / 1000);
    status.textContent = gotText ? "" : `working · ${step} · ${s}s`;
  };
  tick();
  const timer = setInterval(tick, 1000);
  const handle = (ev) => {
    if (ev.kind === "status") { step = ev.text; tick(); }
    else if (ev.kind === "text") { gotText = true; out.hidden = false; out.textContent += ev.text; out.scrollTop = out.scrollHeight; tick(); }
    else if (ev.kind === "error") { failed = true; $("run-error").textContent = ev.text; }
  };
  try {
    const r = await api("/api/run", body);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (line) handle(JSON.parse(line));
      }
    }
    if (buf.trim()) handle(JSON.parse(buf));
    const secs = Math.round((Date.now() - started) / 1000);
    status.textContent = gotText ? `answered in ${secs}s` : (failed ? "" : `no answer after ${secs}s`);
    $("rate").hidden = !gotText;
  } catch (e) {
    $("run-error").textContent = e.message;
  } finally {
    clearInterval(timer);
    $("oneshot").disabled = false;
  }
}

async function rate(verdict) {
  const should = verdict === "bad" && $("should").value ? $("should").value : null;
  if (verdict === "bad" && $("should").hidden) {
    const sel = $("should");
    sel.replaceChildren(el("option", { value: "", textContent: "should have been… (optional)" }));
    for (const t of targets) if (t.name !== chosen) sel.append(el("option", { value: t.name, textContent: `${t.name} · ${t.model}` }));
    sel.hidden = false;
    sel.onchange = () => rate("bad");
    $("rate-done").textContent = "pick what it should have been, or press ✗ again";
    return;
  }
  try {
    await api("/api/rate", { id: current.id, verdict, should });
    $("rate-done").textContent = verdict === "good" ? "rated good" : "rated bad" + (should ? `, should be ${should}` : "");
    $("should").hidden = true;
    loadRecent();
  } catch (e) { $("run-error").textContent = e.message; }
}

async function loadRecent() {
  try {
    const rows = await (await api("/api/decisions?limit=25")).json();
    const body = $("recent");
    body.replaceChildren();
    for (const d of rows) {
      const fb = d.feedback || {};
      const verdict = (fb.verdict === "good" ? "✓" : fb.verdict === "bad" ? "✗" : "") + (fb.should ? " → " + fb.should : "");
      const answers = Object.values(d.answers || {}).map((a) => a.choice).join(" · ") || "manual";
      const target = el("td", { className: "nowrap dot", textContent: d.target || "" });
      target.dataset.vendor = (targets.find((t) => t.name === d.target) || {}).vendor || "";
      body.append(el("tr", {},
        el("td", { className: "dim nowrap", textContent: ago(d.ts) }),
        el("td", { className: "prompt", textContent: (d.prompt || "").slice(0, 160), title: d.prompt || "" }),
        target,
        el("td", { className: "nowrap", textContent: answers }),
        el("td", { className: "num", textContent: d.route_ms ? Math.round(d.route_ms) : "" }),
        el("td", { className: "nowrap " + (fb.verdict || ""), textContent: verdict })));
    }
    $("recent-meta").textContent = rows.length ? "" : "nothing logged yet";
  } catch (e) { $("recent-meta").textContent = e.message; }
}

$("route").onclick = route;
$("prompt").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); route(); } });
$("project").onchange = () => { $("project-other").hidden = $("project").value !== "__other"; };
$("open").onclick = () => run("terminal");
$("oneshot").onclick = () => run("oneshot");
$("rate-good").onclick = () => rate("good");
$("rate-bad").onclick = () => rate("bad");

(async () => {
  try { targets = await (await api("/api/targets")).json(); } catch (e) {}
  await Promise.all([loadStatus(), loadProjects().catch(() => {}), loadRecent()]);
  $("prompt").focus();
  setInterval(() => { if (!document.hidden) { loadStatus(); loadRecent(); } }, 10000);
})();
</script>
</body>
</html>
